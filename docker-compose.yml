services:
  postgres:
    image: postgres:16-alpine
    container_name: amora-flow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agenda
    ports:
      - "5432:5432"
    volumes:
      - amora_flow_pg_data:/var/lib/postgresql/data

volumes:
  amora_flow_pg_data:
